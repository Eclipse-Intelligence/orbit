"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install --no-audit --no-fund"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.sweep]
available_in = [ "local" ]
command = "SWEEP_URL=http://localhost:$CONDUCTOR_PORT npm run sweep"
icon = "smartphone"
